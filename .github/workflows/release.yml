name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            asset: printmark-darwin-arm64
          - goos: darwin
            goarch: amd64
            asset: printmark-darwin-amd64
          - goos: linux
            goarch: amd64
            asset: printmark-linux-amd64
          - goos: linux
            goarch: arm64
            asset: printmark-linux-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          docker build -f Dockerfile \
            --build-arg GOOS=${{ matrix.goos }} \
            --build-arg GOARCH=${{ matrix.goarch }} \
            -o type=local,dest=dist .
          mv dist/printmark ./${{ matrix.asset }}
          chmod +x ./${{ matrix.asset }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./${{ matrix.asset }}
